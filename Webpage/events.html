<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="ccc-page" content="events" />

  <title>Events & Posters | 11th Chinese Cultural Camp (CCC)</title>
  <meta name="description" content="View CCC event posters and key information for the main camp activities." />
  <meta property="og:title" content="Events & Posters | 11th Chinese Cultural Camp (CCC)" />
  <meta property="og:description" content="View CCC event posters and key information for the main camp activities." />
  <meta property="og:image" content="https://images.unsplash.com/photo-1542332213-31f87348057f?q=80&w=2070&auto=format&fit=crop" />
  <meta property="og:type" content="website" />

  <!-- Local Chinese fonts (required) -->
  <link rel="preload" href="./font/Body-YanZhenQingDuoBaoTaBei-2.ttf" as="font" type="font/ttf" crossorigin />
  <link rel="preload" href="./font/Title-SongHuiZongShouJinJiaCuBan.ttf" as="font" type="font/ttf" crossorigin />

  <!-- CDNs (kept from Archived/v1) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-paper text-ink-black overflow-x-hidden selection:bg-gold/30">

  <div id="shuimo-overlay" class="fixed inset-0 z-[100] pointer-events-none opacity-0 flex items-center justify-center">
    <div class="ink-blob w-[150vmax] h-[150vmax] bg-midnight-blue rounded-full scale-0"></div>
  </div>

  <header id="global-header" class="fixed top-0 w-full z-50 transition-all duration-300"></header>

  <main id="app-view" class="min-h-screen pt-20">
    <section class="py-20 px-6 max-w-6xl mx-auto">
      <h1 class="text-5xl text-midnight-blue mb-12 text-center" data-i18n="nav_events">Events</h1>

      <div class="grid md:grid-cols-2 gap-8">
        <a
          class="block group rounded-2xl overflow-hidden border border-sage-green/15 bg-white/60 shadow-lg hover:shadow-xl transition-shadow"
          target="_blank"
          rel="noopener"
          data-lang-href-en="assets/posters/CCC_final 1_English.png"
          data-lang-href-zh="assets/posters/CCC_final 1_Chinese.png"
          href="assets/posters/CCC_final 1_English.png"
        >
          <div class="relative">
            <img
              data-lang-src-en="assets/posters/CCC_final 1_English.png"
              data-lang-src-zh="assets/posters/CCC_final 1_Chinese.png"
              data-lang-alt-en="11th Chinese Cultural Camp main poster"
              data-lang-alt-zh="第十一届全国青年华人文化研习与生活营主海报"
              src="assets/posters/CCC_final 1_English.png"
              alt="11th Chinese Cultural Camp main poster"
              class="w-full h-[460px] object-contain bg-white group-hover:scale-[1.01] transition-transform duration-500"
              loading="lazy"
              decoding="async"
            />
            <div class="absolute inset-0 bg-gradient-to-t from-black/45 via-black/5 to-transparent"></div>
            <div class="absolute bottom-0 left-0 right-0 p-6">
              <div class="text-xs uppercase tracking-[0.25em] text-paper-white/90 font-bold" data-i18n="events_main_poster_label">Main Camp Poster</div>
              <div class="text-sm text-paper-white/90 mt-2" data-i18n="events_main_poster_cta">Click to open the poster PNG</div>
            </div>
          </div>
          <div class="p-6 flex flex-wrap items-center justify-between gap-3">
            <div class="text-sm text-brush-gray leading-relaxed" data-i18n="event_main_desc">
              A 3-day immersive journey featuring elemental rituals and grand puzzles.
            </div>
            <span class="inline-flex items-center gap-2 text-sm font-bold text-midnight-blue border border-midnight-blue/20 px-4 py-2 rounded-full group-hover:border-gold group-hover:text-gold transition-colors">
              <span data-i18n="events_view_poster">View Poster</span>
              <i data-lucide="arrow-up-right" class="w-4 h-4"></i>
            </span>
          </div>
        </a>

        <a
          class="block group rounded-2xl overflow-hidden border border-sage-green/15 bg-white/60 shadow-lg hover:shadow-xl transition-shadow"
          target="_blank"
          rel="noopener"
          data-lang-href-en="assets/posters/CCC_final 2_English.png"
          data-lang-href-zh="assets/posters/CCC_final 2_Chinese.png"
          href="assets/posters/CCC_final 2_English.png"
        >
          <div class="relative">
            <img
              data-lang-src-en="assets/posters/CCC_final 2_English.png"
              data-lang-src-zh="assets/posters/CCC_final 2_Chinese.png"
              data-lang-alt-en="11th Chinese Cultural Camp program poster"
              data-lang-alt-zh="第十一届全国青年华人文化研习与生活营活动内容海报"
              src="assets/posters/CCC_final 2_English.png"
              alt="11th Chinese Cultural Camp program poster"
              class="w-full h-[460px] object-contain bg-white group-hover:scale-[1.01] transition-transform duration-500"
              loading="lazy"
              decoding="async"
            />
            <div class="absolute inset-0 bg-gradient-to-t from-black/45 via-black/5 to-transparent"></div>
            <div class="absolute bottom-0 left-0 right-0 p-6">
              <div class="text-xs uppercase tracking-[0.25em] text-paper-white/90 font-bold" data-i18n="events_secondary_poster_label">Camp Program Poster</div>
              <div class="text-sm text-paper-white/90 mt-2" data-i18n="events_secondary_poster_cta">Click to open the poster PNG</div>
            </div>
          </div>
          <div class="p-6 flex flex-wrap items-center justify-between gap-3">
            <div class="text-sm text-brush-gray leading-relaxed" data-i18n="event_secondary_desc">
              Explore the detailed camp schedule and highlighted workshops.
            </div>
            <span class="inline-flex items-center gap-2 text-sm font-bold text-midnight-blue border border-midnight-blue/20 px-4 py-2 rounded-full group-hover:border-gold group-hover:text-gold transition-colors">
              <span data-i18n="events_view_poster">View Poster</span>
              <i data-lucide="arrow-up-right" class="w-4 h-4"></i>
            </span>
          </div>
        </a>
      </div>
    </section>
  </main>

  <div id="audio-control-bar" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3"></div>
  <footer id="global-footer" class="bg-midnight-blue text-paper-white py-16 px-6"></footer>

  <script type="module" src="js/site.js"></script>
</body>
</html>
